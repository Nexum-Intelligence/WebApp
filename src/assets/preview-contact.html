<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Individual Setup</title>
<style>
  :root{--bg:#0b1220;--panel:#0d1526;--border:#1e293b;--text:#e2e8f0;--muted:#64748b;--accent:#818cf8;--cyan:#67e8f9;--green:#22c55e}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:26px}
  .card{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .hd{display:flex;align-items:center;gap:9px;padding:13px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:650}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
  .hd .sub{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
  .body{padding:20px 22px}
  .chat{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
  .bub{max-width:80%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.4;opacity:0;transform:translateY(8px);animation:pop .5s forwards}
  .bub.them{align-self:flex-start;background:#0a1120;border:1px solid var(--border);border-bottom-left-radius:4px}
  .bub.you{align-self:flex-end;background:linear-gradient(90deg,rgba(129,140,248,.22),rgba(129,140,248,.1));border:1px solid rgba(129,140,248,.4);border-bottom-right-radius:4px}
  .b1{animation-delay:.4s}.b2{animation-delay:1.1s}.b3{animation-delay:1.9s}
  @keyframes pop{to{opacity:1;transform:none}}
  .setup{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:#0a1120;margin-bottom:16px}
  .setup .cal{width:42px;height:42px;border-radius:10px;background:rgba(129,140,248,.16);border:1px solid rgba(129,140,248,.4);display:grid;place-items:center;color:var(--accent);font-weight:800}
  .setup .cal small{display:block;font-size:9px;color:var(--muted);font-weight:600}
  .setup .info{font-size:13px}.setup .info b{display:block}.setup .info span{color:var(--muted);font-size:12px}
  .cta{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:700;color:#fff;border:1px solid rgba(129,140,248,.55);background:linear-gradient(90deg,#6366f1,#818cf8);animation:glow 2s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(129,140,248,.0)}50%{box-shadow:0 0 26px 2px rgba(129,140,248,.45)}}
</style>
</head>
<body>
  <div class="card">
    <div class="hd"><span class="dot"></span> Your Individual Setup <span class="sub">Let's build it together</span></div>
    <div class="body">
      <div class="chat">
        <div class="bub them b1">Your agent team is ready. Let's tailor the setup to your business. 🚀</div>
        <div class="bub you b2">Perfect — when can we start?</div>
        <div class="bub them b3">Book a strategy call and we'll configure everything for you.</div>
      </div>
      <div class="setup">
        <div class="cal">24<small>NEXT</small></div>
        <div class="info"><b>Strategy &amp; Setup Call</b><span>30 min · with the NEXUM team</span></div>
      </div>
      <div class="cta">📞 Book your strategy call</div>
    </div>
  </div>
    <script>
      (function(){
        function fit(){
          try{
            var fe=window.frameElement; if(!fe) return;
            var h=Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
            if(h && Math.abs(parseInt(fe.style.height||0,10)-h)>2) fe.style.height=h+"px";
          }catch(e){}
        }
        window.addEventListener("load",fit);
        window.addEventListener("resize",fit);
        setTimeout(fit,120); setTimeout(fit,600); setTimeout(fit,1600);
      })();
    </script>
</body>
</html>
