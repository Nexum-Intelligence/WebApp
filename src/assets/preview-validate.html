<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Validate the Outcome</title>
<style>
  :root{--bg:#0b1220;--panel:#0d1526;--border:#1e293b;--text:#e2e8f0;--muted:#64748b;--accent:#818cf8;--green:#22c55e;--amber:#f59e0b}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:26px}
  .card{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.45)}
  .hd{display:flex;align-items:center;gap:9px;padding:13px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:650}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
  .hd .sub{margin-left:auto;color:var(--muted);font-size:11px;font-weight:500}
  .body{padding:20px 22px}
  .out{border:1px solid var(--border);border-radius:12px;background:#0a1120;padding:14px 16px;margin-bottom:16px}
  .out .ttl{display:flex;align-items:center;gap:8px;font-weight:650;font-size:14px;margin-bottom:10px}
  .out .ttl .f{width:22px;height:22px;border-radius:6px;background:rgba(129,140,248,.18);color:var(--accent);display:grid;place-items:center;font-size:12px}
  .line{height:8px;border-radius:6px;background:#16233f;margin:7px 0}
  .line.s{width:92%}.line.m{width:72%}.line.l{width:84%}
  .scorebar{height:8px;border-radius:6px;background:#16233f;overflow:hidden;margin:4px 0 6px}
  .scorebar > span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--green));transition:width .9s ease}
  .scoretxt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .scoretxt b{color:var(--text)}
  .fb{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px;border-radius:10px;border:1px solid var(--border);background:#0a1120;font-size:13px;font-weight:600;color:var(--muted);transition:all .3s}
  .btn.revise.pulse{border-color:rgba(245,158,11,.5);color:#fdba74}
  .btn.approve.win{border-color:rgba(34,197,94,.6);background:rgba(34,197,94,.14);color:#bbf7d0}
  .stamp{margin-top:14px;text-align:center;font-size:13px;font-weight:700;color:var(--green);opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s}
  .stamp.show{opacity:1;transform:none}
</style>
</head>
<body>
  <div class="card">
    <div class="hd"><span class="dot"></span> Validate the Outcome <span class="sub">Your feedback loop</span></div>
    <div class="body">
      <div class="out">
        <div class="ttl"><span class="f">&gt;_</span> Business Plan · generated by agents</div>
        <div class="line s"></div><div class="line m"></div><div class="line l"></div>
      </div>
      <div class="scoretxt"><span>Confidence score</span><b id="pct">0%</b></div>
      <div class="scorebar"><span id="bar"></span></div>
      <div class="fb">
        <div class="btn revise" id="revise">↺ Revise</div>
        <div class="btn approve" id="approve">✓ Approve</div>
      </div>
      <div class="stamp" id="stamp">Approved — happy with the result ✓</div>
    </div>
  </div>
<script>
  var bar=document.getElementById("bar"),pct=document.getElementById("pct"),
      revise=document.getElementById("revise"),approve=document.getElementById("approve"),stamp=document.getElementById("stamp");
  function setPct(v){bar.style.width=v+"%";pct.textContent=v+"%"}
  function run(){
    setPct(0);revise.classList.remove("pulse");approve.classList.remove("win");stamp.classList.remove("show");
    setTimeout(function(){setPct(58);revise.classList.add("pulse")},500);
    setTimeout(function(){setPct(76)},1500);
    setTimeout(function(){revise.classList.remove("pulse");setPct(94);approve.classList.add("win")},2600);
    setTimeout(function(){stamp.classList.add("show")},3300);
    setTimeout(run,6200);
  }
  run();
</script>
    <script>
      (function(){
        function fit(){
          try{
            var fe=window.frameElement; if(!fe) return;
            var h=Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
            if(h && Math.abs(parseInt(fe.style.height||0,10)-h)>2) fe.style.height=h+"px";
          }catch(e){}
        }
        window.addEventListener("load",fit);
        window.addEventListener("resize",fit);
        setTimeout(fit,120); setTimeout(fit,600); setTimeout(fit,1600);
      })();
    </script>
</body>
</html>
